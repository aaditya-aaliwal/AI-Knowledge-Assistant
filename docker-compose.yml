services:
  backend:
    container_name: ai-backend

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis
      - rabbitmq

    volumes:
      - .:/app
      - chroma_data:/app/chroma_db

    restart: unless-stopped

    networks:
      - ai-network

  postgres:
    container_name: ai-postgres

    image: postgres:17

    environment:
      POSTGRES_DB: ai_knowledge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - ai-network

  redis:
    container_name: ai-redis

    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - ai-network

  rabbitmq:
    container_name: ai-rabbitmq

    image: rabbitmq:4-management

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

    networks:
      - ai-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  chroma_data:

networks:
  ai-network:
    driver: bridge